<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moumtaz – Comprendre, puis exceller | Cours de soutien en ligne</title>
<meta name="description" content="Cours de soutien en ligne pour collégiens et lycéens, par des ingénieurs d'État. Français, anglais, maths, physique, SVT, informatique. Première séance gratuite.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Caveat:wght@600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCFF; --white:#fff; --ink:#0E1440; --bic:#2338C9; --bic-dark:#1A2AA0; --bic-soft:#ECEFFF;
  --red:#E03A3A; --fluo:#FFE45C; --rule:#DCE2F6; --mute:#565F8C;
  --f:'Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --hand:'Caveat','Segoe Print',cursive;
  color-scheme:light;
}
html[lang=ar]{--hand:'Aref Ruqaa','Caveat',serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:var(--f);background:var(--paper);color:var(--ink);line-height:1.65;font-size:17px;overflow-x:hidden}
html[lang=ar] body{line-height:1.9}
a{color:inherit}
img,svg{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{line-height:1.12;letter-spacing:-.025em}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{letter-spacing:0;line-height:1.35}
h2{font-size:clamp(2rem,4.4vw,3.1rem);font-weight:700;margin-bottom:16px}
h3{font-weight:600}
.lead{color:var(--mute);max-width:58ch;font-size:1.1rem}
:focus-visible{outline:3px solid var(--bic);outline-offset:3px;border-radius:6px}
.sec{padding:96px 0}
@media(max-width:700px){.sec{padding:68px 0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--bic);color:#fff;font:inherit;font-weight:600;padding:15px 26px;border-radius:12px;border:2px solid var(--bic);text-decoration:none;cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{background:var(--bic-dark);border-color:var(--bic-dark);transform:translateY(-1px)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.alt:hover{background:var(--ink);color:#fff}
.btn:disabled{opacity:.6;cursor:wait;transform:none}

/* nav */
nav{position:sticky;top:0;z-index:30;background:rgba(251,252,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
nav .wrap{display:flex;align-items:center;gap:22px;height:70px}
.logo{display:flex;align-items:baseline;gap:9px;text-decoration:none;font-weight:700;font-size:1.45rem;letter-spacing:-.03em}
.logo .ar{font-size:1.05rem;color:var(--bic);font-weight:600;letter-spacing:0}
.logo svg{width:22px;height:18px;align-self:center}
.links{display:flex;gap:24px;list-style:none;margin-inline-start:auto}
.links a{text-decoration:none;color:var(--mute);font-weight:500;font-size:.95rem}
.links a:hover{color:var(--ink)}
.langs{display:flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:#fff}
.langs button{font:inherit;font-size:.85rem;font-weight:600;border:0;background:transparent;color:var(--mute);padding:7px 11px;cursor:pointer}
.langs button[aria-pressed=true]{background:var(--ink);color:#fff}
nav .btn{padding:10px 18px;font-size:.92rem}
@media(max-width:920px){.links{display:none}.langs{margin-inline-start:auto}}
@media(max-width:520px){nav .btn{display:none}.logo .ar{display:none}}

/* hero */
.hero{padding:72px 0 96px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:56px}.hero{padding:48px 0 72px}}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:.92rem;font-weight:500;background:#fff;border:1.5px solid var(--rule);padding:7px 16px 7px 12px;border-radius:10px;margin-bottom:28px}
html[dir=rtl] .badge{padding:7px 12px 7px 16px}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
h1{font-size:clamp(2.6rem,6.2vw,5.1rem);font-weight:700}
h1 .a{display:block;font-weight:300;color:var(--mute)}
h1 .b{display:block;color:var(--bic)}
.hero p.intro{margin:26px 0 34px;max-width:52ch;font-size:1.15rem;color:#2f3766}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hf{display:flex;flex-wrap:wrap;gap:10px 26px;list-style:none;margin-top:38px;font-weight:500;font-size:.95rem}
.hf li{display:flex;align-items:center;gap:8px}
.hf li::before{content:"✓";font-family:'Caveat',cursive;font-weight:700;font-size:1.5rem;line-height:1;color:var(--red)}

/* notebook sheet (the hero moment) */
.sheet{position:relative;background-color:#fff;border-radius:6px;padding:30px 26px 104px;padding-inline-start:80px;min-height:400px;
  box-shadow:0 1px 0 #e3e7f6,0 30px 70px -30px rgba(14,20,64,.45);transform:rotate(-2deg);
  background-image:
    repeating-linear-gradient(180deg,transparent 0 31px,#B4C0EC 31px 32px),
    repeating-linear-gradient(180deg,transparent 0 7px,#EAEEFB 7px 8px),
    repeating-linear-gradient(90deg,transparent 0 31px,#F0F2FC 31px 32px);
  background-position:0 6px}
html[dir=rtl] .sheet{transform:rotate(2deg)}
.sheet::before{content:"";position:absolute;inset-block:0;inset-inline-start:60px;width:2px;background:var(--red);opacity:.65}
.sheet .head{font-family:var(--hand);font-size:1.55rem;font-weight:700;color:var(--bic);line-height:32px;height:32px;margin-bottom:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 110px)}
html[lang=ar] .sheet .head{font-size:1.25rem}
.math{font-family:'Caveat',cursive;font-size:1.7rem;font-weight:600;color:var(--bic);line-height:32px;height:32px;display:flex;gap:12px;align-items:center;unicode-bidi:isolate}
html[dir=rtl] .math{justify-content:flex-end}
.tick{font-family:'Caveat',cursive;color:var(--red);font-weight:700;font-size:1.9rem;opacity:0;transform:scale(1.8)}
.sheet.go .tick{animation:tick .35s ease-out forwards;animation-delay:var(--d)}
@keyframes tick{to{opacity:1;transform:scale(1)}}
.grade{position:absolute;inset-block-start:16px;inset-inline-end:18px;width:118px;height:118px;border:3px solid var(--red);border-radius:50%;
  display:grid;place-items:center;color:var(--red);font-family:'Caveat',cursive;font-weight:700;transform:rotate(-8deg) scale(1.3);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.sheet.graded .grade{transform:rotate(-8deg) scale(1);opacity:1}
.grade div{line-height:1;text-align:center;direction:ltr}
.grade b{font-size:3.3rem;display:block}
.grade span{font-size:1.5rem}
.note{position:absolute;inset-block-end:30px;inset-inline-start:80px;inset-inline-end:20px;color:var(--red);font-family:var(--hand);font-weight:700;font-size:2rem;line-height:1.2;transform:rotate(-3deg);
  clip-path:inset(0 100% 0 0);transition:clip-path 1s cubic-bezier(.6,.1,.3,1)}
html[lang=ar] .note{font-size:1.7rem}
html[dir=rtl] .note{transform:rotate(3deg);clip-path:inset(0 0 0 100%)}
.sheet.done .note{clip-path:inset(0 0 0 0)}
.note svg{display:block;width:min(260px,90%);height:14px;margin-top:2px}
@media(max-width:520px){.sheet{padding-inline-start:64px;padding-inline-end:16px}.sheet::before{inset-inline-start:46px}.note{inset-inline-start:64px}.grade{width:96px;height:96px}.grade b{font-size:2.6rem}.math{font-size:1.45rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.tick{opacity:1;transform:none}.grade{opacity:1;transform:rotate(-8deg)}.note{clip-path:none!important}}

/* who */
.who{background:#fff;border-block:1px solid var(--rule)}
.who .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px}
@media(max-width:860px){.who .wrap{grid-template-columns:1fr;gap:24px}}
.who .txt p{font-size:1.12rem;max-width:62ch}
.who .txt p+p{margin-top:18px;color:var(--mute)}
.sign{font-family:var(--hand);color:var(--bic);font-size:2rem;font-weight:700;margin-top:18px}
html[lang=ar] .sign{font-size:1.6rem}
.wf{list-style:none;margin-top:44px;display:grid;gap:0}
.wf li{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 0;border-top:1.5px solid var(--rule)}
.wf li:last-child{border-bottom:1.5px solid var(--rule)}
.wf b{font-weight:600}
.wf span{color:var(--mute)}
@media(max-width:600px){.wf li{grid-template-columns:1fr;gap:4px}}

/* offer */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--bic-soft);border-radius:12px;margin:36px 0 8px}
.tab{font:inherit;font-weight:600;border:0;background:transparent;color:var(--bic);padding:10px 24px;border-radius:9px;cursor:pointer}
.tab[aria-selected=true]{background:var(--bic);color:#fff}
.levels{list-style:none}
.lv{display:grid;grid-template-columns:230px 1fr auto;gap:20px;align-items:center;padding:22px 0;border-bottom:1.5px solid var(--rule)}
.lv h3{font-size:1.25rem}
.lv p{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.chip{background:var(--bic-soft);color:var(--bic);padding:5px 12px;border-radius:8px;font-size:.86rem;font-weight:500}
@media(max-width:760px){.lv{grid-template-columns:1fr;gap:6px}.chips{justify-content:flex-start;margin-top:6px}}
.sub-h{font-size:1.5rem;margin:64px 0 22px}
.subj{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;list-style:none}
.subj li{position:relative;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:22px 16px;text-align:center;font-weight:600;font-size:1.05rem}
.subj li::after{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(14,20,64,.22);border-radius:9px;pointer-events:none}
.format{margin-top:64px;background:var(--bic-soft);border-radius:18px;padding:32px}
.format p{font-size:1.18rem;max-width:60ch}
.format b{color:var(--bic);font-weight:600}
.tl{margin-top:26px}
.tl-hours{display:flex;justify-content:space-between;font-weight:600;font-size:.92rem;color:var(--mute);direction:ltr}
html[dir=rtl] .tl-hours{direction:rtl}
.track{position:relative;height:16px;border-radius:99px;background:rgba(35,56,201,.18);margin-top:8px}
.track .blk{position:absolute;inset-block:0;inset-inline-start:0;width:40%;border-radius:99px;background:var(--bic)}
.tl-legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:.9rem;color:var(--mute)}
.tl-legend span{display:inline-flex;align-items:center;gap:8px}
.tl-legend i{width:22px;height:10px;border-radius:99px;background:rgba(35,56,201,.18)}
.tl-legend span+span i{background:var(--bic)}

/* method */
.method{background:var(--ink);color:#fff}
.method .lead{color:#AEB6E3}
.ladder{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:52px}
.ladder .top{height:190px;display:flex;align-items:flex-end;margin-bottom:22px;border-bottom:2px solid rgba(255,255,255,.18)}
.ladder .bar{width:100%;height:calc(var(--i) * 25%);border-radius:12px 12px 0 0;background:rgba(124,141,255,calc(.18 + var(--i) * .14));display:flex;align-items:flex-start;padding:12px 14px;font-weight:700;font-size:1.1rem}
.ladder li:last-child .bar{background:var(--fluo);color:var(--ink)}
.ladder li:last-child .bar small{margin-inline-start:auto;font-family:'Caveat',cursive;color:var(--red);font-size:1.8rem;line-height:.8}
.ladder h3{font-size:1.3rem;margin-bottom:8px}
.ladder p{color:#C3C9EC;font-size:.98rem}
@media(max-width:860px){.ladder{grid-template-columns:1fr;gap:30px}.ladder .top{height:auto;border:0;margin-bottom:12px}.ladder .bar{height:44px;width:calc(var(--i) * 25%);min-width:90px;border-radius:10px;align-items:center}}

/* promise */
.promise{padding:110px 0;background-color:#fff;
  background-image:repeating-linear-gradient(180deg,transparent 0 39px,#E3E8F8 39px 40px)}
.promise .wrap{position:relative}
.promise .wrap::before{content:"";position:absolute;inset-block:-110px;inset-inline-start:8px;width:2px;background:var(--red);opacity:.5}
.promise p{font-size:clamp(1.9rem,4.6vw,3.6rem);font-weight:600;line-height:1.25;letter-spacing:-.02em;max-width:22ch;padding-inline-start:40px}
html[lang=ar] .promise p{letter-spacing:0;line-height:1.6}
.promise .hl{background:linear-gradient(transparent 52%,var(--fluo) 52% 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 4px}

/* pricing */
.price{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
@media(max-width:760px){.price{grid-template-columns:1fr}}
.plan{border-radius:20px;padding:36px;background:#fff;border:2px solid var(--rule);display:flex;flex-direction:column}
.plan.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan h3{font-size:1.25rem}
.amt{font-size:3.2rem;font-weight:700;letter-spacing:-.03em;margin:8px 0 4px;color:var(--bic)}
.plan.main .amt{color:var(--fluo)}
.amt small{font-size:1rem;font-weight:400;color:var(--mute);letter-spacing:0}
.plan.main .amt small{color:#AEB6E3}
.plan ul{list-style:none;display:grid;gap:10px;margin:20px 0 30px;flex:1}
.plan li{display:flex;gap:10px}
.plan li::before{content:"✓";font-family:'Caveat',cursive;font-weight:700;font-size:1.4rem;line-height:1.2;color:var(--red)}
.plan.main li::before{color:var(--fluo)}
.plan.main .btn{background:var(--fluo);border-color:var(--fluo);color:var(--ink)}
.plan.main .btn:hover{background:#fff;border-color:#fff}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:28px;counter-reset:s}
@media(max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:s;border-top:2px solid var(--ink);padding-top:16px}
.steps li::before{content:counter(s);display:block;font-family:'Caveat',cursive;font-weight:700;font-size:2.2rem;line-height:1;color:var(--red);margin-bottom:6px}
.steps b{display:block;font-weight:600;margin-bottom:4px}
.steps span{color:var(--mute);font-size:.95rem}

/* form */
.book{background:var(--bic-soft)}
form{background:#fff;border-radius:22px;padding:36px;margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:20px;box-shadow:0 20px 60px -30px rgba(14,20,64,.3)}
@media(max-width:700px){form{grid-template-columns:1fr;padding:24px}}
.f{display:flex;flex-direction:column;gap:7px}
.full{grid-column:1/-1}
label{font-weight:600;font-size:.92rem}
input,select{font:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);width:100%}
input:focus,select:focus{border-color:var(--bic);outline:none;box-shadow:0 0 0 3px rgba(35,56,201,.15)}
input:invalid:not(:placeholder-shown){border-color:var(--red)}
.ltr{direction:ltr}
html[dir=rtl] .ltr{text-align:right}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.9rem;color:var(--mute);font-weight:400}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--bic)}
.hp{position:absolute;inset-inline-start:-9999px}
#msg{padding:16px;border-radius:12px;display:none;font-weight:500}
#msg.ok{display:block;background:#E3F8EE;color:#0d5a3a}
#msg.err{display:block;background:#FDE8E8;color:#8a1f1f}

/* faq */
.faq details{border-bottom:1.5px solid var(--rule);padding:20px 0}
.faq details:first-of-type{border-top:1.5px solid var(--rule);margin-top:30px}
.faq summary{cursor:pointer;font-weight:600;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--bic);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin-top:10px;color:var(--mute);max-width:65ch}

footer{background:var(--ink);color:#AEB6E3;padding:44px 0;font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a{color:#fff}
</style>
</head>
<body>

<nav><div class="wrap">
  <a class="logo" href="#top" aria-label="Moumtaz">
    <span>Moumtaz</span>
    <svg viewBox="0 0 22 18" aria-hidden="true"><path d="M2 10 L8 16 L20 2" fill="none" stroke="#E03A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="ar" lang="ar">ممتاز</span>
  </a>
  <ul class="links">
    <li><a href="#qui" data-i="nWho"></a></li>
    <li><a href="#offre" data-i="nOffer"></a></li>
    <li><a href="#methode" data-i="nMethod"></a></li>
    <li><a href="#tarif" data-i="nPrice"></a></li>
    <li><a href="#faq" data-i="nFaq"></a></li>
  </ul>
  <div class="langs" role="group" aria-label="Langue / اللغة / Language">
    <button type="button" data-lang="fr" lang="fr">FR</button>
    <button type="button" data-lang="ar" lang="ar">العربية</button>
    <button type="button" data-lang="en" lang="en">EN</button>
  </div>
  <a class="btn" href="#reserver" data-i="nCta"></a>
</div></nav>

<header class="hero" id="top"><div class="wrap">
  <div>
    <div class="badge"><i></i><span data-i="badge"></span></div>
    <h1><span class="a" data-i="h1a"></span><span class="b" data-i="h1b"></span></h1>
    <p class="intro" data-i="heroP"></p>
    <div class="cta"><a class="btn" href="#reserver" data-i="cta1"></a><a class="btn alt" href="#methode" data-i="cta2"></a></div>
    <ul class="hf" id="hf"></ul>
  </div>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="head" data-i="sheetHead"></div>
    <div class="math" dir="ltr">f(x) = ln(x) / x <span class="tick" style="--d:.3s">✓</span></div>
    <div class="math" dir="ltr">f′(x) = (1 − ln x) / x² <span class="tick" style="--d:.6s">✓</span></div>
    <div class="math" dir="ltr">f′(x) = 0 ⇔ x = e <span class="tick" style="--d:.9s">✓</span></div>
    <div class="math" dir="ltr">max f = f(e) = 1/e <span class="tick" style="--d:1.2s">✓</span></div>
    <div class="grade"><div><b id="gnum">08</b><span>/20</span></div></div>
    <div class="note"><span data-i="note"></span>
      <svg viewBox="0 0 260 14" preserveAspectRatio="none"><path d="M3 9 C 60 3, 140 13, 257 5" fill="none" stroke="#E03A3A" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
  </div>
</div></header>

<section class="who sec" id="qui"><div class="wrap">
  <h2 data-i="whoT"></h2>
  <div class="txt">
    <p data-i="whoP1"></p>
    <p data-i="whoP2"></p>
    <div class="sign" data-i="sign"></div>
    <ul class="wf" id="wf"></ul>
  </div>
</div></section>

<section class="sec" id="offre"><div class="wrap">
  <h2 data-i="offerT"></h2>
  <p class="lead" data-i="offerL"></p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-t="col" data-i="tabCol"></button>
    <button class="tab" role="tab" aria-selected="false" data-t="lyc" data-i="tabLyc"></button>
  </div>
  <ul class="levels" id="levels" role="tabpanel"></ul>

  <h3 class="sub-h" data-i="subjT"></h3>
  <ul class="subj" id="subj"></ul>

  <div class="format">
    <h3 class="sub-h" style="margin:0 0 10px" data-i="fmtT"></h3>
    <p data-i="fmtP"></p>
    <div class="tl" aria-hidden="true">
      <div class="tl-hours" id="hours"></div>
      <div class="track"><div class="blk"></div></div>
      <div class="tl-legend"><span><i></i><em data-i="fmtRange" style="font-style:normal"></em></span><span><i></i><em data-i="fmtBlock" style="font-style:normal"></em></span></div>
    </div>
  </div>
</div></section>

<section class="method sec" id="methode"><div class="wrap">
  <h2 data-i="methodT"></h2>
  <p class="lead" data-i="methodL"></p>
  <ol class="ladder" id="ladder"></ol>

let lang='fr',cyc='col';

function renderLevels(){
  const t=T[lang],idx=cyc==='col'?[0,1,2]:[3,4,5];
  $('#levels').innerHTML=idx.map(i=>`<li class="lv"><h3>${t.lv[i]}</h3><p>${t.lvd[i]}</p>${i>2?`<div class="chips">${t.fil[i].map(c=>`<span class="chip">${c}</span>`).join('')}</div>`:'<span></span>'}</li>`).join('');
}
function renderFil(){
  const t=T[lang],v=$('#cycle').value,i=T.fr.lv.indexOf(v),cur=$('#fil').value;
  $('#fil').innerHTML=i<0?`<option value="">${t.chooseLv}</option>`:T.fr.fil[i].map((x,j)=>`<option value="${x}">${t.fil[i][j]}</option>`).join('');
  if(cur&&[...$('#fil').options].some(o=>o.value===cur))$('#fil').value=cur;
}
function render(l){
  lang=T[l]?l:'fr';const t=T[lang],H=document.documentElement;
  H.lang=lang;H.dir=lang==='ar'?'rtl':'ltr';
  document.title=t.title;document.querySelector('meta[name=description]').content=t.desc;
  $$('[data-i]').forEach(e=>{const v=t[e.dataset.i];if(typeof v==='string')e.innerHTML=v});
  $$('[data-p]').forEach(e=>e.placeholder=t[e.dataset.p]);
  $('#hf').innerHTML=t.hf.map(x=>`<li>${x}</li>`).join('');
  $('#wf').innerHTML=t.wf.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('');
  $('#subj').innerHTML=t.subj.map(x=>`<li>${x}</li>`).join('');
  $('#hours').innerHTML=t.hours.map(x=>`<span>${x}</span>`).join('');
  $('#ladder').innerHTML=t.m.map(([a,b],k)=>`<li style="--i:${k+1}"><div class="top"><div class="bar">${k+1}${k===3?'<small>20/20</small>':''}</div></div><h3>${a}</h3><p>${b}</p></li>`).join('');
  $('#p1l').innerHTML=t.p1l.map(x=>`<li>${x}</li>`).join('');
  $('#p2l').innerHTML=t.p2l.map(x=>`<li>${x}</li>`).join('');
  $('#steps').innerHTML=t.s.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('');
  $('#faqList').innerHTML=t.faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  renderLevels();
  // selects (values stay in French so submissions are consistent)
  const cv=$('#cycle').value,hv=$('#heure').value;
  $('#cycle').innerHTML=`<option value="">${t.choose}</option>`+T.fr.lv.map((v,i)=>`<option value="${v}">${t.lv[i]}</option>`).join('');
  $('#cycle').value=cv;renderFil();
  let opts=`<option value="">${t.choose}</option>`;
  for(let m=19*60;m<=22*60;m+=30){const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');opts+=`<option value="${h}h${mm}">${t.fmtHour(h,mm)}</option>`}
  $('#heure').innerHTML=opts;$('#heure').value=hv;
  $('#langField').value=lang;
  $$('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $('#msg').className='';
  try{localStorage.setItem('moumtaz-lang',lang)}catch(e){}
}

// initial language: saved choice, then browser language, then French
let start='fr';
try{start=localStorage.getItem('moumtaz-lang')||''}catch(e){start=''}
if(!start){const n=(navigator.language||'fr').slice(0,2);start=T[n]?n:'fr'}
render(start);

$$('.langs button').forEach(b=>b.onclick=()=>render(b.dataset.lang));
$$('.tab').forEach(b=>b.onclick=()=>{cyc=b.dataset.t;$$('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));renderLevels()});
$('#cycle').onchange=renderFil;

// hero moment: ticks, then the grade climbs, then the teacher's note
(function(){
  const s=$('#sheet'),g=$('#gnum');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){g.textContent='19';s.classList.add('go','graded','done');return}
  requestAnimationFrame(()=>s.classList.add('go'));
  setTimeout(()=>{
    s.classList.add('graded');
    const from=8,to=19,dur=1100,t0=performance.now();
    (function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
      g.textContent=String(Math.round(from+(to-from)*e)).padStart(2,'0');
      if(p<1)requestAnimationFrame(step);else setTimeout(()=>s.classList.add('done'),150)})(t0);
  },1700);
})();

// secure submission (Web3Forms)
const form=$('#form'),msg=$('#msg');let last=0;
form.addEventListener('submit',async e=>{
  e.preventDefault();msg.className='';
  if(!form.checkValidity()){form.reportValidity();return}
  if(Date.now()-last<15000)return;          // anti-spam: 1 submission / 15 s
  if(form.botcheck.checked)return;          // bot trap
  const t=T[lang],btn=$('#send');
  last=Date.now();btn.disabled=true;btn.textContent=t.sending;
  try{
    const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Accept':'application/json'},body:new FormData(form)});
    const j=await r.json();
    if(!j.success)throw 0;
    msg.className='ok';msg.textContent=t.ok;form.reset();renderFil();$('#langField').value=lang;
  }catch(err){msg.className='err';msg.textContent=t.err}
  btn.disabled=false;btn.textContent=t.send;
});
</script>
